---
- name: Deploy Node.js App on Private EC2
  hosts: app_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Add NodeSource repository for newer Node.js
      shell: curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
    

    - name: Install Node.js, npm, and git
      apt:
        name:
          - nodejs
          - npm
          - git
        state: present

    - name: Remove old node_modules
      file:
        path: /var/www/node-app/node_modules
        state: absent    

    - name: Install PM2 globally (Process Manager to keep app running)
      npm:
        name: pm2
        global: yes

    - name: Ensure app directory exists
      file:
        path: /var/www/node-app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Clone the Node.js application from GitHub
      git:
        repo: 'https://github.com/AlaaElgazwy/node-aws-app.git'
        dest: /var/www/node-app
        version: main
        force: yes

    - name: Install application dependencies
      npm:
        path: /var/www/node-app

    - name: Stop existing PM2 process if running
      command: pm2 stop backend-app
      ignore_errors: yes
      args:
        chdir: /var/www/node-app

    - name: Start the application with PM2
      shell: >
        DB_HOST={{ rds_endpoint }} REDIS_HOST={{ redis_endpoint }} PORT=3000 
        pm2 start index.js --name backend-app --update-env
      args:
        chdir: /var/www/node-app